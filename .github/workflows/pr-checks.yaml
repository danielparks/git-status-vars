name: PR checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR: 1

# These would more naturally be separate jobs, but GitHub actions “bills” each
# job separately and rounds up to the next minute, so four 10 second jobs “cost”
# my account 4 action minutes.
jobs:
  checks:
    name: Checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    timeout-minutes: 30
    permissions:
      security-events: write # SARIF reporting for zizmor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-msrv

      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        if: ${{ !cancelled() && runner.os == 'Linux' }}

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          persona: pedantic

      - uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
        if: ${{ !cancelled() && runner.os == 'Linux' }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          rust-version: "1.85.0"

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo +stable clippy --all-features --all-targets

      - name: cargo doc lints
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: --document-private-items -Dwarnings
        run: cargo +stable doc --no-deps --all-features

      - name: cargo msrv
        if: ${{ !cancelled() }}
        run: cargo msrv verify

      - name: cargo build
        id: cargo_build
        if: ${{ !cancelled() }}
        run: cargo +stable build --tests --all-features

      - name: cargo test
        if: ${{ !cancelled() && steps.cargo_build.outcome == 'success' }}
        run: cargo +stable test --all-features
